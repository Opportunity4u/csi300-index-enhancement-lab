name: Bug report
description: Report a reproducible correctness or implementation issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not attach credentials or licensed market data."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Prefer synthetic inputs or a small generated example.
    validations:
      required: true
  - type: dropdown
    id: timing
    attributes:
      label: Could this involve information timing or execution delay?
      options:
        - "Yes"
        - "No"
        - "Unsure"
    validations:
      required: true
